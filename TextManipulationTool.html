<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Manipulation Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f0f5;--surface:#fff;--surface2:#f5f5f7;--border:#d1d1d6;
  --text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;
  --accent:#0071e3;--danger:#c0392b;--danger-bg:#fef6f5;--danger-bd:#f0cece;
  --sh1:0 1px 3px rgba(0,0,0,.07);--sh2:0 2px 8px rgba(0,0,0,.10);
  --fu:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --fm:'SF Mono','Menlo','Monaco','Consolas','Courier New',monospace;
  --r:5px;--r2:4px
}
[data-theme=dark]{
  --bg:#1c1c1e;--surface:#2c2c2e;--surface2:#3a3a3c;--border:#48484a;
  --text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;
  --accent:#0a84ff;--danger:#ff453a;--danger-bg:#2c1010;--danger-bd:#5e2020
}
html,body{height:100%;font-family:var(--fu);font-size:13px;color:var(--text);background:var(--bg)}
body{
  display:grid;
  grid-template-rows:auto 1fr auto;
  grid-template-columns:172px 1fr;
  grid-template-areas:"tb tb" "sb main" "ft ft";
  overflow:hidden;height:100vh
}

/* ── Top bar ── */
#topbar{
  grid-area:tb;display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px;background:var(--surface);border-bottom:1px solid var(--border);
  gap:6px;box-shadow:var(--sh1);min-width:0
}
#tb-left{display:flex;align-items:center;gap:7px;flex-shrink:0}
#hdr-title{font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
#edition-badge{font-size:10px;background:var(--accent);color:#fff;padding:2px 7px;border-radius:10px;font-weight:500}
#tb-right{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.tb-btn{
  font-family:var(--fu);font-size:12px;padding:3px 9px;
  border:1px solid var(--border);border-radius:var(--r2);
  background:var(--surface2);color:var(--text);cursor:pointer;white-space:nowrap;
  transition:background .1s,border-color .1s
}
.tb-btn:hover{background:var(--border)}
.tb-btn:active{opacity:.75}
.tb-btn:disabled{opacity:.38;cursor:default;pointer-events:none}
.tb-sep{width:1px;height:16px;background:var(--border);margin:0 2px;flex-shrink:0}

/* ── Sidebar ── */
#sidebar{
  grid-area:sb;background:var(--surface2);border-right:1px solid var(--border);
  overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column
}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
#sb-search-wrap{
  padding:6px;position:sticky;top:0;background:var(--surface2);
  z-index:1;border-bottom:1px solid var(--border)
}
#sb-search{
  width:100%;font-family:var(--fu);font-size:12px;padding:5px 8px;
  border:1px solid var(--border);border-radius:var(--r2);
  background:var(--surface);color:var(--text);outline:none
}
#sb-search:focus{border-color:var(--accent)}
.sb-section{border-bottom:1px solid var(--border)}
.sb-head{
  width:100%;text-align:left;padding:6px 8px;font-family:var(--fu);
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text2);background:none;border:none;cursor:pointer;
  display:flex;align-items:center;gap:5px
}
.sb-head:hover{background:rgba(0,0,0,.04)}
[data-theme=dark] .sb-head:hover{background:rgba(255,255,255,.05)}
.sb-head.danger{color:var(--danger)}
.sb-arrow{font-size:9px;line-height:1}
.sb-body{padding:3px 5px 6px;display:flex;flex-direction:column;gap:2px}
.sb-btn{
  width:100%;text-align:left;padding:5px 9px;font-family:var(--fu);font-size:12px;
  border:1px solid transparent;border-radius:var(--r2);background:none;
  color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .08s,border-color .08s
}
.sb-btn:hover{background:var(--surface);border-color:var(--border)}
.sb-btn:active{opacity:.7}
.sb-btn.danger{color:var(--danger)}
.sb-btn.danger:hover{background:var(--danger-bg);border-color:var(--danger-bd)}
.sb-btn.flash{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}

/* ── Main ── */
#main{grid-area:main;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#D{
  flex:1;width:100%;min-height:0;
  font-family:var(--fm);font-size:13px;line-height:1.55;
  padding:10px 12px;border:none;border-bottom:1px solid var(--border);
  background:var(--surface);color:var(--text);resize:none;outline:none;
  tab-size:4;white-space:pre
}
#D::placeholder{color:var(--text3);font-style:italic}
#D::-webkit-scrollbar{width:8px;height:8px}
#D::-webkit-scrollbar-track{background:var(--surface2)}
#D::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
#D::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* ── Find panel ── */
#find-panel{
  display:flex;align-items:center;gap:4px;padding:5px 8px;
  background:var(--surface2);border-bottom:1px solid var(--border);flex-wrap:wrap
}
#find-panel[hidden]{display:none}
#fp-find,#fp-replace{
  font-family:var(--fm);font-size:12px;padding:3px 7px;
  border:1px solid var(--border);border-radius:var(--r2);
  background:var(--surface);color:var(--text);outline:none;width:150px
}
#fp-find:focus,#fp-replace:focus{border-color:var(--accent)}
.fp-label{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:3px;cursor:pointer;user-select:none}
.fp-btn{
  font-family:var(--fu);font-size:12px;padding:3px 8px;
  border:1px solid var(--border);border-radius:var(--r2);
  background:var(--surface);color:var(--text);cursor:pointer
}
.fp-btn:hover{background:var(--border)}
#fp-count{font-size:11px;color:var(--text2);min-width:55px}

/* ── Footer ── */
#footer{
  grid-area:ft;display:flex;align-items:center;gap:8px;
  padding:4px 8px;background:var(--surface2);
  border-top:1px solid var(--border);font-size:11px;color:var(--text2)
}
#status{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#xy-fields{display:flex;gap:5px;flex-shrink:0}
.xy-wrap{
  display:flex;align-items:center;gap:4px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r2);
  padding:3px 7px;width:140px
}
.xy-wrap:focus-within{border-color:var(--accent)}
.xy-wrap label{color:var(--text3);white-space:nowrap;font-size:11px;user-select:none}
.t{flex:1;font-family:var(--fm);font-size:12px;border:none;background:transparent;color:var(--text);outline:none;min-width:0}
.credit{flex-shrink:0;color:var(--text3)}
.credit a{color:var(--text3);text-decoration:none}
.credit a:hover{color:var(--accent)}

/* ── Toast ── */
#toast{
  position:fixed;bottom:36px;right:16px;background:#1d1d1f;color:#f5f5f7;
  font-size:12px;padding:7px 14px;border-radius:8px;box-shadow:var(--sh2);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:999;max-width:280px
}
#toast.show{opacity:1}
[data-theme=dark] #toast{background:#e5e5ea;color:#1d1d1f}
</style>
</head>
<body>

<div id="topbar">
  <div id="tb-left">
    <span id="hdr-title">Text Manipulation Tool</span>
    <span id="edition-badge">Universal</span>
  </div>
  <div id="tb-right">
    <button class="tb-btn" id="btn-open-file" title="Open file (drag &amp; drop also works)">Open</button>
    <button class="tb-btn" id="btn-save" title="Download as text file (Ctrl/⌘+S)">Save</button>
    <button class="tb-btn" id="btn-copy" title="Copy all text (Ctrl/⌘+Shift+C)">Copy</button>
    <button class="tb-btn" id="btn-clear" title="Clear editor">Clear</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btn-undo" title="Undo last operation (Ctrl/⌘+Z)" disabled>↩ Undo</button>
    <button class="tb-btn" id="btn-redo" title="Redo (Ctrl/⌘+Shift+Z)" disabled>↪ Redo</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btn-find" title="Find &amp; Replace (Ctrl/⌘+F)">Find</button>
    <button class="tb-btn" id="btn-wrap" title="Toggle word wrap">Wrap</button>
    <button class="tb-btn" id="btn-dark" title="Toggle dark mode">🌙 Dark</button>
  </div>
</div>

<nav id="sidebar">
  <div id="sb-search-wrap">
    <input id="sb-search" type="text" placeholder="🔍 filter…" autocomplete="off" spellcheck="false">
  </div>

  <div class="sb-section">
    <button class="sb-head"><span class="sb-arrow">▾</span>Edit</button>
    <div class="sb-body">
      <button class="sb-btn" data-action="insert" title="Prepend X and append Y to every non-empty line">Insert</button>
      <button class="sb-btn" data-action="replace" title="Replace all X with Y (Ctrl/⌘-click: eval Y as JS expression, i = match index)">Replace</button>
      <button class="sb-btn" data-action="addLineNumbers" title="Prefix each line with 1. 2. 3. …">Number Lines</button>
      <button class="sb-btn" data-action="joinLines" title="Join all lines into one, separated by X">Join Lines</button>
      <button class="sb-btn" data-action="splitByX" title="Split each line into multiple lines at every X">Split by X</button>
      <button class="sb-btn" data-action="removeLinesWithX" title="Delete every line containing X">Remove w/ X</button>
      <button class="sb-btn" data-action="keepLinesWithX" title="Keep only lines that contain X">Keep w/ X</button>
      <button class="sb-btn" data-action="duplicateLines" title="Duplicate every line">Duplicate</button>
      <button class="sb-btn" data-action="padLines" title="Left-pad each line to X chars using Y (default space)">Pad Lines</button>
    </div>
  </div>

  <div class="sb-section">
    <button class="sb-head danger"><span class="sb-arrow">▾</span>Delete</button>
    <div class="sb-body">
      <button class="sb-btn danger" data-action="deleteBefore" title="Remove everything before and including the first X on each line">Before X</button>
      <button class="sb-btn danger" data-action="deleteInBetween" title="Remove text between X and Y on each line">X … Y</button>
      <button class="sb-btn danger" data-action="deleteAfter" title="Remove everything after and including the last X on each line">After X</button>
    </div>
  </div>

  <div class="sb-section">
    <button class="sb-head"><span class="sb-arrow">▾</span>Order</button>
    <div class="sb-body">
      <button class="sb-btn" data-action="sortLines" title="Sort A→Z (Ctrl/⌘-click: sort Z→A)">Sort</button>
      <button class="sb-btn" data-action="reverseLines" title="Reverse line order">Reverse</button>
      <button class="sb-btn" data-action="shuffleLines" title="Randomly shuffle lines (Fisher-Yates)">Shuffle</button>
      <button class="sb-btn" data-action="reverseEachLine" title="Reverse characters within each line (hello → olleh)">Flip Lines</button>
    </div>
  </div>

  <div class="sb-section">
    <button class="sb-head"><span class="sb-arrow">▾</span>Case</button>
    <div class="sb-body">
      <button class="sb-btn" data-action="uppercase" title="UPPER CASE">UPPER</button>
      <button class="sb-btn" data-action="lowercase" title="lower case">lower</button>
      <button class="sb-btn" data-action="titleCase" title="Title Case Every Word">Title Case</button>
      <button class="sb-btn" data-action="sentenceCase" title="Capitalize first letter of each sentence">Sentence</button>
      <button class="sb-btn" data-action="camelCase" title="camelCase">camelCase</button>
      <button class="sb-btn" data-action="pascalCase" title="PascalCase">PascalCase</button>
      <button class="sb-btn" data-action="snakeCase" title="snake_case">snake_case</button>
      <button class="sb-btn" data-action="kebabCase" title="kebab-case">kebab-case</button>
      <button class="sb-btn" data-action="constantCase" title="CONSTANT_CASE">CONSTANT_</button>
      <button class="sb-btn" data-action="dotCase" title="dot.case">dot.case</button>
      <button class="sb-btn" data-action="alternatingCase" title="aLtErNaTiNg CaSe">aLtErNaTiNg</button>
      <button class="sb-btn" data-action="inverseCase" title="Flip UPPER↔lower for every letter">iNVERSE</button>
      <button class="sb-btn" data-action="slugify" title="lowercase-slug-with-hyphens (removes accents &amp; punctuation)">Slugify</button>
    </div>
  </div>

  <div class="sb-section">
    <button class="sb-head"><span class="sb-arrow">▾</span>Clean</button>
    <div class="sb-body">
      <button class="sb-btn" data-action="uniqueLines" title="Remove duplicate lines (keep first occurrence)">Unique Lines</button>
      <button class="sb-btn" data-action="removeBlanks" title="Delete all empty lines">Remove Blanks</button>
      <button class="sb-btn" data-action="trimLines" title="Strip leading &amp; trailing whitespace from each line">Trim</button>
      <button class="sb-btn" data-action="removeExtraSpaces" title="Collapse multiple consecutive spaces into one">Extra Spaces</button>
      <button class="sb-btn" data-action="removeHTMLTags" title="Strip all HTML/XML tags leaving plain text">Strip HTML</button>
      <button class="sb-btn" data-action="sortList" title="Deduplicate + remove blanks + interleave lines">List Sorter</button>
      <button class="sb-btn" data-action="removeAccents" title="Remove diacritical marks (é→e, ñ→n, ü→u)">No Accents</button>
      <button class="sb-btn" data-action="removePunctuation" title="Remove all punctuation characters">No Punct.</button>
      <button class="sb-btn" data-action="removeNumbers" title="Remove all digit characters 0–9">No Numbers</button>
      <button class="sb-btn" data-action="removeNonASCII" title="Remove characters with code point > 127">ASCII Only</button>
      <button class="sb-btn" data-action="dedupeWords" title="Remove duplicate words within each line">Dedupe Words</button>
    </div>
  </div>

  <div class="sb-section">
    <button class="sb-head"><span class="sb-arrow">▾</span>Encode</button>
    <div class="sb-body">
      <button class="sb-btn" data-action="encodeURL" title="URL-encode (encodeURIComponent)">URL Encode</button>
      <button class="sb-btn" data-action="decodeURL" title="URL-decode (decodeURIComponent)">URL Decode</button>
      <button class="sb-btn" data-action="base64Encode" title="Base64 encode">B64 Encode</button>
      <button class="sb-btn" data-action="base64Decode" title="Base64 decode">B64 Decode</button>
      <button class="sb-btn" data-action="htmlEncode" title="HTML entity encode (&amp;amp; &amp;lt; &amp;gt; &amp;quot;)">HTML Encode</button>
      <button class="sb-btn" data-action="htmlDecode" title="HTML entity decode back to characters">HTML Decode</button>
      <button class="sb-btn" data-action="rot13" title="ROT13 cipher — rotate each letter 13 positions">ROT13</button>
      <button class="sb-btn" data-action="hexEncode" title="Encode text bytes as hex pairs (e.g. 68 65 6c 6c 6f)">Hex Encode</button>
      <button class="sb-btn" data-action="hexDecode" title="Decode hex pairs back to text">Hex Decode</button>
      <button class="sb-btn" data-action="binaryEncode" title="Encode text bytes as 8-bit binary groups">Bin Encode</button>
      <button class="sb-btn" data-action="binaryDecode" title="Decode binary string back to text">Bin Decode</button>
      <button class="sb-btn" data-action="unicodeEscape" title="Escape characters to \uXXXX sequences">\u Escape</button>
      <button class="sb-btn" data-action="unicodeUnescape" title="Unescape \uXXXX sequences back to characters">\u Unescape</button>
      <button class="sb-btn" data-action="jsonEscape" title="Escape string for embedding inside JSON (adds \" escapes etc.)">JSON Escape</button>
      <button class="sb-btn" data-action="jsonUnescape" title="Unescape a JSON-encoded string">JSON Unescape</button>
      <button class="sb-btn" data-action="morseEncode" title="Encode text to Morse code (· and −)">Morse Encode</button>
      <button class="sb-btn" data-action="morseDecode" title="Decode Morse code back to text">Morse Decode</button>
    </div>
  </div>

  <div class="sb-section">
    <button class="sb-head"><span class="sb-arrow">▾</span>Hash</button>
    <div class="sb-body">
      <button class="sb-btn" data-action="md5Hash" title="MD5 hash (hex output)">MD5</button>
      <button class="sb-btn" data-action="sha1Hash" title="SHA-1 hash (hex output)">SHA-1</button>
      <button class="sb-btn" data-action="sha256Hash" title="SHA-256 hash (hex output)">SHA-256</button>
      <button class="sb-btn" data-action="sha512Hash" title="SHA-512 hash (hex output)">SHA-512</button>
    </div>
  </div>

  <div class="sb-section">
    <button class="sb-head"><span class="sb-arrow">▾</span>Data</button>
    <div class="sb-body">
      <button class="sb-btn" data-action="jsonFormat" title="Pretty-print JSON (indent size = X, default 2)">JSON Format</button>
      <button class="sb-btn" data-action="jsonMinify" title="Minify / compact JSON to one line">JSON Minify</button>
      <button class="sb-btn" data-action="csvToJson" title="Convert CSV to a JSON array of objects">CSV → JSON</button>
      <button class="sb-btn" data-action="jsonToCsv" title="Convert JSON array of objects to CSV">JSON → CSV</button>
      <button class="sb-btn" data-action="jsonToTable" title="Convert JSON array to a Markdown table">JSON → Table</button>
      <button class="sb-btn" data-action="csvToTable" title="Convert CSV to a Markdown table">CSV → Table</button>
      <button class="sb-btn" data-action="extractEmails" title="Extract all email addresses, one per line">Extract Emails</button>
      <button class="sb-btn" data-action="extractUrls" title="Extract all http/https URLs, one per line">Extract URLs</button>
      <button class="sb-btn" data-action="extractNumbers" title="Extract all numbers (integers and decimals), one per line">Extract Nums</button>
      <button class="sb-btn" data-action="jwtDecode" title="Decode a JWT token — shows header &amp; payload as JSON">JWT Decode</button>
    </div>
  </div>

  <div class="sb-section">
    <button class="sb-head"><span class="sb-arrow">▾</span>Generate</button>
    <div class="sb-body">
      <button class="sb-btn" data-action="loremIpsum" title="Generate X paragraphs of Lorem Ipsum (default 3)">Lorem Ipsum</button>
      <button class="sb-btn" data-action="uuidV4" title="Generate X UUID v4 values, one per line (default 1)">UUID v4</button>
      <button class="sb-btn" data-action="randomNumbers" title="Generate X random integers from 0 to Y (default: 10 nums, 0–100)">Random Nums</button>
      <button class="sb-btn" data-action="numberSequence" title="Generate integer sequence from X to Y, one per line">Sequence</button>
      <button class="sb-btn" data-action="insertTimestamp" title="Insert current Unix timestamp (seconds since epoch)">Timestamp</button>
      <button class="sb-btn" data-action="insertDateTime" title="Insert current ISO 8601 date/time">Date / Time</button>
    </div>
  </div>

  <div class="sb-section">
    <button class="sb-head"><span class="sb-arrow">▾</span>Nav</button>
    <div class="sb-body">
      <button class="sb-btn" data-action="gotoLine" title="Move cursor to line number X">Go to Line</button>
      <button class="sb-btn" data-action="selectLine" title="Select the entire line at line number X">Select Line</button>
    </div>
  </div>
</nav>

<div id="main">
  <textarea id="D" wrap="off" spellcheck="false"
    placeholder="Paste or type text here, or drag &amp; drop a file…"></textarea>
  <div id="find-panel" hidden>
    <input id="fp-find" placeholder="Find…" autocomplete="off" spellcheck="false">
    <input id="fp-replace" placeholder="Replace with…" autocomplete="off" spellcheck="false">
    <label class="fp-label"><input type="checkbox" id="fp-regex"> Regex</label>
    <label class="fp-label"><input type="checkbox" id="fp-case"> Case</label>
    <button class="fp-btn" id="fp-prev" title="Previous match (Shift+Enter)">◀</button>
    <button class="fp-btn" id="fp-next" title="Next match (Enter)">▶</button>
    <button class="fp-btn" id="fp-repl-one">Replace</button>
    <button class="fp-btn" id="fp-repl-all">All</button>
    <span id="fp-count"></span>
    <button class="fp-btn" id="fp-close" title="Close (Esc)">✕</button>
  </div>
</div>

<div id="footer">
  <span id="status">Ready</span>
  <div id="xy-fields">
    <div class="xy-wrap">
      <label for="X">X&nbsp;=</label>
      <input id="X" class="t" value="&amp;" spellcheck="false" autocomplete="off">
    </div>
    <div class="xy-wrap">
      <label for="Y">Y&nbsp;=</label>
      <input id="Y" class="t" value="'\n'" spellcheck="false" autocomplete="off">
    </div>
  </div>
  <span class="credit">by <a href="https://github.com/whatsdd" target="_blank">Rashid Saleem</a></span>
</div>

<div id="toast"></div>
<input type="file" id="file-open" accept=".txt,.csv,.json,.md,.log,.xml,.html,.js,.ts,.css" style="display:none">

<script>
'use strict';

/* ── DOM refs ─────────────────────────────────────────────────────────── */
var D      = document.getElementById('D');
var Xin    = document.getElementById('X');
var Yin    = document.getElementById('Y');
var statusEl = document.getElementById('status');

function X() { return Xin.value; }
function Y() { return Yin.value; }

/* ── History (undo / redo) ────────────────────────────────────────────── */
var _hist = [''], _hIdx = 0;

function _record(v) {
  if (_hist[_hIdx] === v) return;           // already the current tip — skip dup
  _hist = _hist.slice(0, _hIdx + 1);
  _hist.push(v);
  if (_hist.length > 100) _hist.shift();
  _hIdx = _hist.length - 1;
  _syncUndoBtns();
}

// Called BEFORE an operation to capture the current (e.g. just-typed) text.
function pushHistory() { _record(D.value); }

function undo() {
  if (_hIdx > 0) { _hIdx--; D.value = _hist[_hIdx]; updateStatus(); _syncUndoBtns(); }
}
function redo() {
  if (_hIdx < _hist.length - 1) { _hIdx++; D.value = _hist[_hIdx]; updateStatus(); _syncUndoBtns(); }
}
function _syncUndoBtns() {
  document.getElementById('btn-undo').disabled = _hIdx <= 0;
  document.getElementById('btn-redo').disabled = _hIdx >= _hist.length - 1;
}

/* ── Core helpers ─────────────────────────────────────────────────────── */
function getLines() { return D.value.split(/\r\n|\r|\n/); }
function setLines(lines) { D.value = lines.join('\n'); _record(D.value); updateStatus(); }
function getVal() { return D.value; }
function setVal(v) { D.value = v; _record(v); updateStatus(); }

function updateStatus() {
  var v = D.value;
  var lines = v.split(/\r\n|\r|\n/);
  var chars = v.length;
  var words = v.trim() === '' ? 0 : v.trim().split(/\s+/).length;

function toWords(s) {
  return s
    .replace(/([a-z])([A-Z])/g, '$1 $2')
    .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')

/* ── CSV parser ───────────────────────────────────────────────────────── */
function parseCSV(text) {
  var rows = [], row = [], field = '', inQ = false, i = 0, ch;
  while (i < text.length) {
    ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i+1] === '"') { field += '"'; i += 2; continue; }
        inQ = false;
      } else { field += ch; }
    } else {
      if (ch === '"') { inQ = true; }
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\r') { /* skip */ }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += ch; }
    }
    i++;
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  if (rows.length && rows[rows.length-1].length === 1 && rows[rows.length-1][0] === '') rows.pop();
  return rows;
}

  try {
    var data = JSON.parse(getVal());
    if(!Array.isArray(data)||data.length===0) throw new Error('Expected non-empty JSON array');
    var keys = Object.keys(data[0]);
    var lines = ['| '+keys.join(' | ')+' |', '| '+keys.map(function(){ return '---'; }).join(' | ')+' |'];
    data.forEach(function(row){
      lines.push('| '+keys.map(function(k){ return String(row[k]!=null?row[k]:''); }).join(' | ')+' |');
    });
    setVal(lines.join('\n'));
  } catch(e) { showToast('JSON→Table failed: '+e.message); }
}

function csvToTable() {
  pushHistory();
  var rows = parseCSV(getVal());
  if(rows.length===0) return;
  var lines = ['| '+rows[0].join(' | ')+' |', '| '+rows[0].map(function(){ return '---'; }).join(' | ')+' |'];
  rows.slice(1).forEach(function(row){ lines.push('| '+row.join(' | ')+' |'); });
  setVal(lines.join('\n'));
}

function extractEmails() {
  pushHistory();
  var m = getVal().match(/[\w.+\-]+@[\w\-]+\.[\w.]{2,}/g) || [];
  setVal(Array.from(new Set(m)).join('\n'));
}

function extractUrls() {
  pushHistory();
  var m = getVal().match(/https?:\/\/[^\s"'<>)\]]+/g) || [];
  setVal(Array.from(new Set(m)).join('\n'));
}

function extractNumbers() {
  pushHistory();
  var m = getVal().match(/-?\d+\.?\d*/g) || [];
  setVal(m.join('\n'));
}

function jwtDecode() {
  pushHistory();
  function b64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; try{ var b=atob(s); var bytes=new Uint8Array(b.length); for(var i=0;i<b.length;i++) bytes[i]=b.charCodeAt(i); return new TextDecoder().decode(bytes); } catch(e){ return s; } }
  var parts = getVal().trim().split('.');
  if(parts.length!==3){ showToast('Not a valid JWT — expected 3 dot-separated parts'); return; }
  try {
    var hdr = JSON.parse(b64u(parts[0]));
    var pay = JSON.parse(b64u(parts[1]));
    setVal('// Header\n'+JSON.stringify(hdr,null,2)+'\n\n// Payload\n'+JSON.stringify(pay,null,2)+'\n\n// Signature (raw)\n'+parts[2]);
  } catch(e) { showToast('JWT decode failed: '+e.message); }
}

/* ── Generate ─────────────────────────────────────────────────────────── */
function loremIpsum() {
  var n = parseInt(X(),10)||3;
  var paras = [];
  for(var p=0;p<n;p++){
    var sents=[];
    for(var s=0;s<(4+Math.floor(Math.random()*4));s++){
      var wc=8+Math.floor(Math.random()*12), ws=[];
      for(var w=0;w<wc;w++) ws.push(LOREM[Math.floor(Math.random()*LOREM.length)]);
      var sent=ws.join(' '); sents.push(sent.charAt(0).toUpperCase()+sent.slice(1)+'.');
    }
    paras.push(sents.join(' '));
  }
  insertAtCursor(paras.join('\n\n'));
}

function uuidV4() {
  var n = parseInt(X(),10)||1;
  var uuids = [];
  for(var i=0;i<n;i++){
    var a=new Uint8Array(16); crypto.getRandomValues(a);
    a[6]=(a[6]&0x0f)|0x40; a[8]=(a[8]&0x3f)|0x80;
    var h=Array.from(a,function(b){ return ('0'+b.toString(16)).slice(-2); });
    uuids.push(h.slice(0,4).join('')+'-'+h.slice(4,6).join('')+'-'+h.slice(6,8).join('')+'-'+h.slice(8,10).join('')+'-'+h.slice(10).join(''));
  }
  insertAtCursor(uuids.join('\n'));
}

function randomNumbers() {
  var count = parseInt(X(),10)||10;
  var max   = parseInt(Y(),10);
  if(isNaN(max)) max=100;
  var r=[];
  for(var i=0;i<count;i++) r.push(String(Math.floor(Math.random()*(max+1))));
  insertAtCursor(r.join('\n'));
}

function numberSequence() {
  var from=parseInt(X(),10), to=parseInt(Y(),10);
  if(isNaN(from)||isNaN(to)){ showToast('Set X = start and Y = end'); return; }
  var r=[], step=from<=to?1:-1;
  for(var n=from; from<=to?n<=to:n>=to; n+=step) r.push(String(n));
  insertAtCursor(r.join('\n'));
}

function insertTimestamp() { insertAtCursor(String(Math.floor(Date.now()/1000))); }
function insertDateTime()  { insertAtCursor(new Date().toISOString()); }

/* ── Nav ──────────────────────────────────────────────────────────────── */
function gotoLine() {
  var lines=getLines(), n=parseInt(X(),10);
  if(isNaN(n)||n<1||n>lines.length){ showToast('Line '+n+' out of range (1–'+lines.length+')'); return; }
  var pos=0; for(var i=0;i<n-1;i++) pos+=lines[i].length+1;
  D.focus(); D.setSelectionRange(pos,pos);
}

function selectLine() {
  var lines=getLines(), n=parseInt(X(),10);
  if(isNaN(n)||n<1||n>lines.length){ showToast('Line '+n+' out of range (1–'+lines.length+')'); return; }
  var pos=0; for(var i=0;i<n-1;i++) pos+=lines[i].length+1;
  D.focus(); D.setSelectionRange(pos, pos+lines[n-1].length);
}

/* ── Sidebar click handler ────────────────────────────────────────────── */
document.getElementById('sidebar').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  var fn = actions[btn.dataset.action];
  if (!fn) return;
  fn(e);
  btn.classList.add('flash');
  setTimeout(function(){ btn.classList.remove('flash'); }, 180);
});

/* ── Sidebar collapse ─────────────────────────────────────────────────── */
document.querySelectorAll('.sb-head').forEach(function(head) {
  head.addEventListener('click', function() {
    var body = this.parentElement.querySelector('.sb-body');
    var arrow = this.querySelector('.sb-arrow');
    var isOpen = body.style.display !== 'none';
    body.style.display = isOpen ? 'none' : '';
    arrow.textContent = isOpen ? '▸' : '▾';
  });
});

/* ── Sidebar filter ───────────────────────────────────────────────────── */
document.getElementById('sb-search').addEventListener('input', function() {
  var q = this.value.toLowerCase().trim();
  document.querySelectorAll('.sb-section').forEach(function(sec) {
    var btns = sec.querySelectorAll('.sb-btn');
    var any = false;
    btns.forEach(function(btn) {
      var match = !q || btn.textContent.toLowerCase().includes(q) || (btn.title||'').toLowerCase().includes(q);
      btn.style.display = match ? '' : 'none';
      if (match) any = true;
    });
    sec.style.display = (!q || any) ? '' : 'none';
    if (q && any) {
      sec.querySelector('.sb-body').style.display = '';
      sec.querySelector('.sb-arrow').textContent = '▾';
    }
  });
});

/* ── Find & Replace panel ─────────────────────────────────────────────── */
var _fpMatches = [], _fpIdx = -1;

function _fpRegex() {
  var q = document.getElementById('fp-find').value;
  if (!q) return null;
  var flags = document.getElementById('fp-case').checked ? 'g' : 'gi';
  if (document.getElementById('fp-regex').checked) {
    try { return new RegExp(q, flags); } catch(e) { return null; }
  }
  return new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), flags);
}

function _fpUpdate() {
  _fpMatches = [];
  var re = _fpRegex();
  if (!re) { document.getElementById('fp-count').textContent=''; return; }
  var text = D.value, m;
  while ((m = re.exec(text)) !== null) {
    _fpMatches.push({s: m.index, e: m.index+m[0].length});
    if (m[0].length===0) re.lastIndex++;
  }
  document.getElementById('fp-count').textContent = _fpMatches.length + ' match' + (_fpMatches.length!==1?'es':'');
}

function _fpNav(dir) {
  _fpUpdate();
  if (_fpMatches.length===0) return;
  _fpIdx = (_fpIdx + dir + _fpMatches.length) % _fpMatches.length;
  var m = _fpMatches[_fpIdx];
  D.focus(); D.setSelectionRange(m.s, m.e);
  var lh = parseFloat(getComputedStyle(D).lineHeight)||19;
  D.scrollTop = (D.value.substring(0,m.s).split('\n').length - 5) * lh;
}

function _fpReplaceOne() {
  _fpUpdate();
  var re = _fpRegex(); if(!re) return;
  var repl = document.getElementById('fp-replace').value;
  var text = D.value, m;
  re.lastIndex = D.selectionStart;
  if ((m = re.exec(text)) !== null) {
    pushHistory();
    D.value = text.substring(0,m.index) + repl + text.substring(m.index+m[0].length);
    _record(D.value);
    D.setSelectionRange(m.index, m.index+repl.length);
    updateStatus(); _fpUpdate();
  } else {
    _fpNav(1);
  }
}

function _fpReplaceAll() {
  var re = _fpRegex(); if(!re) return;
  pushHistory();
  var repl = document.getElementById('fp-replace').value;
  setVal(D.value.replace(re, repl));
  _fpUpdate();
}

function openFind(withReplace) {
  var panel = document.getElementById('find-panel');
  var fpRepl = document.getElementById('fp-replace');
  panel.hidden = false;
  fpRepl.style.display = withReplace ? '' : 'none';
  document.getElementById('fp-find').focus();
  _fpUpdate();
}

function closeFind() {
  document.getElementById('find-panel').hidden = true;
  D.focus();
}

document.getElementById('fp-next').addEventListener('click', function(){ _fpNav(1); });
document.getElementById('fp-prev').addEventListener('click', function(){ _fpNav(-1); });
document.getElementById('fp-repl-one').addEventListener('click', _fpReplaceOne);
document.getElementById('fp-repl-all').addEventListener('click', _fpReplaceAll);
document.getElementById('fp-close').addEventListener('click', closeFind);
document.getElementById('fp-find').addEventListener('input', function(){ _fpIdx=-1; _fpUpdate(); });
document.getElementById('fp-find').addEventListener('keydown', function(e){
  if(e.key==='Enter'){ e.shiftKey?_fpNav(-1):_fpNav(1); e.preventDefault(); }
  if(e.key==='Escape') closeFind();
});

/* ── File handling ────────────────────────────────────────────────────── */
D.addEventListener('dragover', function(e){ e.preventDefault(); D.style.outline='2px dashed var(--accent)'; });
D.addEventListener('dragleave', function(){ D.style.outline=''; });
D.addEventListener('drop', function(e){
  e.preventDefault(); D.style.outline='';
  var file = e.dataTransfer.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){ pushHistory(); setVal(ev.target.result); showToast('Loaded: '+file.name); };
  reader.readAsText(file);
});

document.getElementById('btn-open-file').addEventListener('click', function(){
  document.getElementById('file-open').click();
});
document.getElementById('file-open').addEventListener('change', function(){
  var file = this.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){ pushHistory(); setVal(ev.target.result); showToast('Loaded: '+file.name); };
  reader.readAsText(file);
  this.value='';
});

/* ── Save / Copy / Clear ──────────────────────────────────────────────── */
document.getElementById('btn-save').addEventListener('click', function(){
  var blob = new Blob([getVal()],{type:'text/plain'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download='text.txt'; a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('btn-copy').addEventListener('click', function(){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(getVal()).then(function(){ showToast('Copied to clipboard!'); });
  } else {
    D.select(); document.execCommand('copy'); showToast('Copied!');
  }
});

document.getElementById('btn-clear').addEventListener('click', function(){
  if(getVal()===''){ return; }
  pushHistory(); setVal(''); D.focus();
});

/* ── Undo / Redo buttons ──────────────────────────────────────────────── */
document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-redo').addEventListener('click', redo);

/* ── Word wrap toggle ─────────────────────────────────────────────────── */
document.getElementById('btn-wrap').addEventListener('click', function(){
  var isWrap = D.style.whiteSpace === 'pre-wrap';
  D.style.whiteSpace = isWrap ? 'pre' : 'pre-wrap';
  this.style.background = isWrap ? '' : 'var(--accent)';
  this.style.color = isWrap ? '' : '#fff';
  this.style.borderColor = isWrap ? '' : 'var(--accent)';
});

/* ── Dark mode ────────────────────────────────────────────────────────── */
function _applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  var btn = document.getElementById('btn-dark');
  btn.textContent = theme==='dark' ? '☀ Light' : '🌙 Dark';
  try{ localStorage.setItem('tmtTheme', theme); } catch(e){}
}

document.getElementById('btn-dark').addEventListener('click', function(){
  _applyTheme(document.documentElement.dataset.theme==='dark' ? '' : 'dark');
});

/* ── Find button ──────────────────────────────────────────────────────── */
document.getElementById('btn-find').addEventListener('click', function(){
  openFind(true);
});

/* ── Tab key in textarea ──────────────────────────────────────────────── */
D.addEventListener('keydown', function(e){
  if(e.key==='Tab'){
    e.preventDefault();
    var s=D.selectionStart, en=D.selectionEnd;
    D.value = D.value.substring(0,s)+'\t'+D.value.substring(en);
    D.selectionStart = D.selectionEnd = s+1;
  }
});

/* ── Selection → status update ───────────────────────────────────────── */
D.addEventListener('select', updateStatus);
D.addEventListener('click', updateStatus);
D.addEventListener('keyup', updateStatus);
D.addEventListener('input', updateStatus);

/* ── Global keyboard shortcuts ───────────────────────────────────────── */
document.addEventListener('keydown', function(e){
  var mod = e.ctrlKey || e.metaKey;
  if(!mod) return;
  if(e.key==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
  else if((e.key==='z'&&e.shiftKey)||e.key==='y'){ e.preventDefault(); redo(); }
  else if(e.key==='s'){ e.preventDefault(); document.getElementById('btn-save').click(); }
  else if(e.key==='f'){ e.preventDefault(); openFind(false); }
  else if(e.key==='h'){ e.preventDefault(); openFind(true); }
  else if(e.key==='C'&&e.shiftKey){ e.preventDefault(); document.getElementById('btn-copy').click(); }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeFind();
});

/* ── Init ─────────────────────────────────────────────────────────────── */
(function init(){
  try{ _applyTheme(localStorage.getItem('tmtTheme')||''); } catch(e){ _applyTheme(''); }
  _hist = [D.value]; _hIdx = 0; _syncUndoBtns();
  updateStatus();
  D.focus();
})();
</script>
