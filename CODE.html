<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Manipulation Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ececec;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 6px;
    gap: 5px;
    color: #1d1d1f;
  }

  #toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 5px 6px;
    background: #f5f5f7;
    border: 1px solid #d1d1d6;
    border-radius: 8px;
  }

  .btn {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid #c7c7cc;
    background: #ffffff;
    color: #1d1d1f;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, border-color 0.1s;
  }
  .btn:hover  { background: #e5e5ea; border-color: #aeaeb2; }
  .btn:active { background: #d1d1d6; border-color: #8e8e93; }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 0 4px;
    border-left: 1px solid #d1d1d6;
  }
  .btn-group:first-child { border-left: none; padding-left: 0; }

  .group-label {
    font-size: 10px;
    color: #8e8e93;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding-right: 2px;
  }

  #inputs {
    display: flex;
    gap: 5px;
  }

  .input-wrap {
    display: flex;
    align-items: center;
    flex: 1;
    gap: 5px;
    background: #f5f5f7;
    border: 1px solid #d1d1d6;
    border-radius: 6px;
    padding: 4px 8px;
  }

  .input-wrap label {
    font-size: 11px;
    color: #8e8e93;
    white-space: nowrap;
  }

  .t {
    flex: 1;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    border: none;
    background: transparent;
    color: #1d1d1f;
    outline: none;
  }

  #D {
    flex: 1;
    width: 100%;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    border: 1px solid #d1d1d6;
    border-radius: 6px;
    padding: 8px;
    resize: none;
    background: #ffffff;
    color: #1d1d1f;
    outline: none;
    line-height: 1.5;
    tab-size: 4;
  }
  #D:focus { border-color: #0071e3; box-shadow: 0 0 0 2px rgba(0,113,227,0.2); }

  #footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: #8e8e93;
    padding: 0 2px;
  }

  #status { font-style: italic; }
</style>
</head>
<body>

<div id="toolbar">
  <div class="btn-group">
    <span class="group-label">Edit</span>
    <button class="btn" data-action="insert"          title="Prepend X and append Y to each non-empty line">Insert</button>
    <button class="btn" data-action="replace"         title="Replace all X with Y  (Ctrl-click: evaluate Y as expression)">Replace</button>
  </div>
  <div class="btn-group">
    <span class="group-label">Delete</span>
    <button class="btn" data-action="deleteBefore"    title="Delete everything before (and including) the first X on each line">Before X</button>
    <button class="btn" data-action="deleteInBetween" title="Delete text between X and Y on each line">X &hellip; Y</button>
    <button class="btn" data-action="deleteAfter"     title="Delete everything after (and including) the last X on each line">After X</button>
  </div>
  <div class="btn-group">
    <span class="group-label">Order</span>
    <button class="btn" data-action="sortLines"       title="Sort lines A to Z  (Ctrl-click: sort Z to A)">Sort</button>
    <button class="btn" data-action="reverseLines"    title="Reverse line order">Reverse</button>
  </div>
  <div class="btn-group">
    <span class="group-label">Case</span>
    <button class="btn" data-action="uppercase"       title="Convert all text to UPPER CASE">Uppercase</button>
    <button class="btn" data-action="lowercase"       title="Convert all text to lower case">Lowercase</button>
  </div>
  <div class="btn-group">
    <span class="group-label">Clean</span>
    <button class="btn" data-action="uniqueLines"     title="Remove duplicate lines (keeps first occurrence)">Unique</button>
    <button class="btn" data-action="removeBlanks"    title="Remove all empty lines">Remove Blanks</button>
    <button class="btn" data-action="sortList"        title="Deduplicate, remove blanks, then interleave lines">List Sorter</button>
  </div>
  <div class="btn-group">
    <span class="group-label">Encode</span>
    <button class="btn" data-action="encodeURL"       title="URL-encode the entire text (encodeURIComponent)">Encode URL</button>
    <button class="btn" data-action="decodeURL"       title="URL-decode the entire text (decodeURIComponent)">Decode URL</button>
  </div>
  <div class="btn-group">
    <span class="group-label">Nav</span>
    <button class="btn" data-action="gotoLine"        title="Jump to line number specified in X field">Go to Line</button>
  </div>
</div>

<div id="inputs">
  <div class="input-wrap">
    <label for="X">X&nbsp;=</label>
    <input id="X" class="t" value="&" spellcheck="false" autocomplete="off">
  </div>
  <div class="input-wrap">
    <label for="Y">Y&nbsp;=</label>
    <input id="Y" class="t" value="'\n'" spellcheck="false" autocomplete="off">
  </div>
</div>

<textarea id="D" wrap="off" spellcheck="false" placeholder="Paste or type your text here…"></textarea>

<div id="footer">
  <span id="status">Ready</span>
  <span>Text Manipulation Tool &mdash; Windows Edition &nbsp;|&nbsp; Original by <strong>Rashid Saleem</strong></span>
</div>

<script>
'use strict';

var D      = document.getElementById('D');
var Xin    = document.getElementById('X');
var Yin    = document.getElementById('Y');
var status = document.getElementById('status');

function X() { return Xin.value; }
function Y() { return Yin.value; }

function getLines() {
  return D.value.split(/\r\n|\r|\n/);
}

function setLines(lines) {
  D.value = lines.join('\n');
  updateStatus();
}

function getVal() { return D.value; }
function setVal(v) { D.value = v; updateStatus(); }

function updateStatus() {
  var lines = getLines();
  var chars = D.value.length;
  status.textContent = lines.length + ' line' + (lines.length === 1 ? '' : 's') +
    ', ' + chars + ' char' + (chars === 1 ? '' : 's');
}

// ── Operations ────────────────────────────────────────────────────────────────

function insert() {
  var lines = getLines();
  for (var i = 0; i < lines.length; i++) {
    if (lines[i] !== '') {
      lines[i] = X() + lines[i] + Y();
    }
  }
  setLines(lines);
}

function replace(e) {
  var isCmd = e.ctrlKey || e.metaKey;
  if (!isCmd) {
    setVal(getVal().split(X()).join(Y()));
  } else {
    var parts = getVal().split(X());
    for (var i = 1; i < parts.length; i++) {
      /* jshint evil:true */
      parts[i] = eval(Y()) + parts[i]; // eslint-disable-line no-eval
    }
    setVal(parts.join(''));
  }
}

function deleteBefore() {
  var lines = getLines();
  for (var i = 0; i < lines.length; i++) {
    var parts = lines[i].split(X());
    if (parts.length > 1) parts.shift();
    lines[i] = parts.join(X());
  }
  setLines(lines);
}

function deleteAfter() {
  var lines = getLines();
  for (var i = 0; i < lines.length; i++) {
    var parts = lines[i].split(X());
    if (parts.length > 1) parts.pop();
    lines[i] = parts.join(X());
  }
  setLines(lines);
}

function deleteInBetween() {
  var lines = getLines();
  for (var i = 0; i < lines.length; i++) {
    var xparts = lines[i].split(X());
    var xx = xparts.shift();
    var rest = xparts.join(X());
    var yparts = rest.split(Y());
    yparts.shift();
    lines[i] = xx + yparts.join(Y());
  }
  setLines(lines);
}

function sortLines(e) {
  var isCmd = e.ctrlKey || e.metaKey;
  var lines = getLines().sort();
  setLines(lines);
  if (isCmd) reverseLines();
}

function reverseLines() {
  setLines(getLines().reverse());
}

function uniqueLines() {
  var seen = Object.create(null);
  var result = getLines().filter(function(line) {
    if (line in seen) return false;
    seen[line] = true;
    return true;
  });
  setLines(result);
}

function removeBlanks() {
  setLines(getLines().filter(function(l) { return l !== ''; }));
}

function sortList() {
  uniqueLines();
  removeBlanks();
  var lines = getLines();
  var result = [];
  for (var i = 0; i < lines.length; i++) {
    result.push(i % 2 === 0 ? lines[i / 2] : lines[lines.length - (i - 1) / 2 - 1]);
  }
  setLines(result);
}

function encodeURL() {
  setVal(encodeURIComponent(getVal()));
}

function decodeURL() {
  try {
    setVal(decodeURIComponent(getVal()));
  } catch (e) {
    setVal(getVal());
  }
}

function uppercase() { setVal(getVal().toUpperCase()); }
function lowercase() { setVal(getVal().toLowerCase()); }

function gotoLine() {
  var lines = getLines();
  var n = parseInt(X(), 10);
  if (isNaN(n) || n < 1 || n > lines.length) {
    alert('Line ' + n + ' is out of range (1–' + lines.length + ')');
    return;
  }
  var pos = 0;
  for (var i = 0; i < n - 1; i++) { pos += lines[i].length + 1; }
  D.focus();
  D.setSelectionRange(pos, pos);
}

// ── Action dispatch ───────────────────────────────────────────────────────────

var actions = {
  insert:          function(e) { insert(); },
  replace:         function(e) { replace(e); },
  deleteBefore:    function(e) { deleteBefore(); },
  deleteInBetween: function(e) { deleteInBetween(); },
  deleteAfter:     function(e) { deleteAfter(); },
  sortLines:       function(e) { sortLines(e); },
  reverseLines:    function(e) { reverseLines(); },
  uppercase:       function(e) { uppercase(); },
  lowercase:       function(e) { lowercase(); },
  uniqueLines:     function(e) { uniqueLines(); },
  removeBlanks:    function(e) { removeBlanks(); },
  sortList:        function(e) { sortList(); },
  encodeURL:       function(e) { encodeURL(); },
  decodeURL:       function(e) { decodeURL(); },
  gotoLine:        function(e) { gotoLine(); },
};

document.getElementById('toolbar').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  var fn = actions[btn.dataset.action];
  if (fn) fn(e);
});

// ── Textarea helpers ──────────────────────────────────────────────────────────

D.addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    var start = D.selectionStart;
    var end   = D.selectionEnd;
    D.value = D.value.substring(0, start) + '\t' + D.value.substring(end);
    D.selectionStart = D.selectionEnd = start + 1;
  }
});

D.addEventListener('input', updateStatus);

// ── Layout ────────────────────────────────────────────────────────────────────

function resize() {
  var toolbar = document.getElementById('toolbar');
  var inputs  = document.getElementById('inputs');
  var footer  = document.getElementById('footer');
  var usedHeight = toolbar.offsetHeight +
                   inputs.offsetHeight  +
                   footer.offsetHeight  +
                   6 * 5;
  D.style.height = Math.max(100, window.innerHeight - usedHeight) + 'px';
}

window.addEventListener('resize', resize);
window.addEventListener('load', function() {
  resize();
  updateStatus();
  D.focus();
});
</script>
</body>
</html>
